    <script>
        // If GitHub Pages served 404.html for a client-side route, restore the intended
        // path so the React router can render the correct page.
        (function () {
            try {
                var redirect = window.sessionStorage.getItem('spa-redirect');
                if (redirect) {
                    window.sessionStorage.removeItem('spa-redirect');
                    window.history.replaceState(null, null, redirect);
                }
            } catch (e) { }
        })();
    </script>
